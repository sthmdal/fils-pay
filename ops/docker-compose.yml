# FilsPay stack: Postgres + apps/api + apps/settlement + apps/reporting.
# apps/web and apps/admin are static front-ends that call apps/api over HTTP.
#
# Sized for one small server (~2 GB RAM). Run from the repo root:
#
#   cp ops/.env.example ops/.env      # then fill in real secrets
#   docker compose -f ops/docker-compose.yml up -d --build
#
# What changed and why (see docs/FINDINGS.md):
#   - The seed TRUNCATEs the whole database (... CASCADE). It used to run on
#     EVERY `up`. It is now behind the `seed` profile and only runs when asked:
#       docker compose -f ops/docker-compose.yml --profile seed run --rm seed
#     Never run it against a database you care about.
#   - App services wait for `migrate` to finish successfully.
#   - Secrets come from ops/.env (gitignored), not from a committed file.
#   - restart policies, memory limits and healthchecks so the stack stays up.
#   - Postgres is published on 127.0.0.1 only.
#   - Ops/Dockerfile.node and ops/Dockerfile.go now exist.
#   - NEVER `docker compose down -v`: -v deletes the database volume.

x-app-env: &app-env
  DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ops/.env}@postgres:5432/filspay?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: filspay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ops/.env}
      POSTGRES_DB: filspay
    # Small-box tuning; defaults assume far more memory.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60", "-c", "work_mem=4MB"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - filspay_pgdata:/var/lib/postgresql/data
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filspay -d filspay"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-off: applies db/migrations/*.sql, then exits. Safe to re-run; the
  # runner skips migrations already recorded in schema_migrations.
  migrate:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "migrate"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  # DESTRUCTIVE: TRUNCATE ... RESTART IDENTITY CASCADE on every core table.
  # Opt-in only (profile), for a brand-new empty database.
  seed:
    profiles: ["seed"]
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "seed"]
    # The seed loads apps/api's config, which requires the production secrets.
    env_file: .env
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npx", "tsx", "apps/api/src/index.ts"]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      SETTLEMENT_INTERNAL_URL: http://settlement:8091
      PG_POOL_MAX: "10"
    ports:
      - "3000:3000"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  settlement:
    build:
      context: ..
      dockerfile: ops/Dockerfile.go
    command: ["/app/settlement", "daemon"]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
    # Internal API (8091) is reachable only on the compose network.
    expose:
      - "8091"
    mem_limit: 256m
    depends_on:
      migrate:
        condition: service_completed_successfully

  reporting:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    # No subcommand = `worker`.
    command: ["npx", "tsx", "apps/reporting/src/index.ts"]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      PG_POOL_MAX: "4"
    mem_limit: 256m
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  filspay_pgdata:
